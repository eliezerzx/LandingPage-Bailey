<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bailey Aplicativos — Ecossistema para Delivery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bailey-green':  '#4ade80',
            'bailey-purple': '#7c3aed',
            'bailey-dark':   '#050806',
            'bailey-card':   '#0c120e',
          },
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            body:    ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="text-white overflow-x-hidden">

  <header class="fixed top-0 left-0 right-0 z-50 bg-bailey-dark/80 backdrop-blur-md border-b border-white/5 h-[72px]">
    <div class="flex items-center justify-between h-full max-w-7xl mx-auto px-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full border border-bailey-purple flex items-center justify-center bg-bailey-purple/10 overflow-hidden">
            <img src="images/logo.png" alt="Logo Bailey" class="w-full h-full object-cover">
        </div>
        <div>
          <div class="font-display font-extrabold text-lg leading-none">Bailey</div>
          <div class="text-[9px] tracking-widest text-bailey-green uppercase mt-0.5">Aplicativos</div>
        </div>
      </div>
      
      <nav class="hidden md:flex items-center gap-8 text-sm font-normal text-white/70">
        <a href="#" class="hover:text-bailey-green transition-colors">Empresa</a>
        <a href="#" class="hover:text-bailey-green transition-colors">Soluções</a>
        <a href="#" class="hover:text-bailey-green transition-colors">Resultados</a>
        <a href="#" class="text-bailey-green border border-bailey-green/40 px-4 py-1.5 rounded-full hover:bg-bailey-green/10 transition-all font-normal">Bailey Business</a>
      </nav>
    </div>
  </header>

  <main class="pt-[72px]">
    <section class="max-w-[1400px] mx-auto px-6 py-12 flex flex-col items-center">
      
      <div id="ecosystem-viewport" class="relative w-full max-w-[1150px] h-[580px] my-2 overflow-visible">
        
        <svg id="network-svg" class="absolute inset-0 w-full h-full pointer-events-none z-10"></svg>

        <div id="central-hub" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-[120px] h-[120px] bg-black/95 rounded-full flex items-center justify-center border border-bailey-purple/30 glow-purple overflow-hidden shadow-2xl">
            <img src="images/logo.png" alt="Logo Bailey" class="w-full h-full object-cover">
        </div>

        <div id="branches-container" class="absolute inset-0 w-full h-full z-20 pointer-events-none"></div>
      </div>

      <div class="text-center max-w-3xl z-30 mt-4">
        <h1 class="text-4xl md:text-6xl font-display font-extrabold tracking-tight leading-tight">
          Ecossistema para <span class="text-transparent bg-clip-text bg-gradient-to-r from-bailey-green to-emerald-400">Delivery</span>
        </h1>
        <p class="mt-6 text-white/60 text-base md:text-lg max-w-xl mx-auto leading-relaxed">
          Automatizamos sua operação com software PDV, frente de caixa, cardápio digital e integração total com os maiores marketplaces do mercado.
        </p>
        
        <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center items-center">
          <a href="https://wa.me/5512988886499" target="_blank" class="bg-bailey-green text-black font-normal px-8 py-4 rounded-full flex items-center gap-3 hover:bg-emerald-400 transition-all transform hover:scale-105 glow-green btn-pulse w-full sm:w-auto justify-center">
            <i class="fab fa-whatsapp text-xl"></i>
            Chama no WhatsApp
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
